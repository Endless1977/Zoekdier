name: Dieren ophalen

on:
  schedule:
    - cron: "17 */6 * * *"   # elke 6 uur
  workflow_dispatch:
    inputs:
      max_detail:
        description: "Max. nieuwe detailpagina's per run (Verhuisdieren)"
        default: "350"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scraper draaien
        env:
          ZOEKDIER_MAX_DETAIL: ${{ github.event.inputs.max_detail || '350' }}
          MP_CLIENT_ID: ${{ secrets.MP_CLIENT_ID }}
          MP_CLIENT_SECRET: ${{ secrets.MP_CLIENT_SECRET }}
        run: python scraper/run.py
      - name: Data committen
        run: |
          git config user.name "zoekdier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "Data bijgewerkt $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push

name: Schermafbeeldingen

# Maakt de schermafbeeldingen in docs/screenshots opnieuw na elke wijziging van de app,
# en wekelijks met verse gegevens (dan staan er ook echte foto's van dieren op).
on:
  push:
    branches: [main]
    paths: ["index.html", "assets/**", "tools/screenshots.py"]
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/screenshots.py
      - name: Committen
        run: |
          git config user.name "zoekdier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "Schermafbeeldingen bijgewerkt"
          git pull --rebase origin main
          git push

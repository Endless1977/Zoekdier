<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoekdier – honden, katten, vogels en meer</title>
<link rel="icon" href="assets/wapen.svg">
<style>
:root{
  --bg:#f6f2ea;--paneel:#fffdf8;--rand:#e4dccb;--tekst:#2b2a26;--zacht:#6f6a5e;
  --groen:#2f6b4f;--groen2:#e3efe7;--oranje:#c8661c;--rood:#b23a2e;--rood2:#f8e3df;--geel:#d9a521;
  --blauw:#1f3b73;--radius:14px;--schaduw:0 2px 10px rgba(60,50,30,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tekst)}
button,input,select{font:inherit}
header{background:var(--blauw);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
header img{height:46px}
header h1{margin:0;font-family:Georgia,serif;font-size:1.6rem;letter-spacing:.5px}
header .sub{font-size:.8rem;opacity:.8}
header .rechts{margin-left:auto;display:flex;gap:8px}
.knop{border:1px solid var(--rand);background:var(--paneel);color:var(--tekst);border-radius:10px;padding:7px 12px;cursor:pointer}
header .knop{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.tabs{display:flex;gap:4px;padding:10px 18px 0;background:var(--bg);position:sticky;top:66px;z-index:15;overflow-x:auto}
.tab{border:1px solid var(--rand);border-bottom:none;background:#efe8da;padding:10px 18px;border-radius:12px 12px 0 0;cursor:pointer;font-weight:600;white-space:nowrap;color:var(--zacht)}
.tab.actief{background:var(--paneel);color:var(--tekst)}
.tab .tel{font-weight:400;font-size:.8rem;background:var(--groen2);color:var(--groen);border-radius:20px;padding:1px 7px;margin-left:6px}
main{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:0 18px 30px}
aside{background:var(--paneel);border:1px solid var(--rand);border-radius:0 var(--radius) var(--radius) var(--radius);padding:14px;align-self:start;position:sticky;top:116px;max-height:calc(100vh - 130px);overflow:auto}
aside h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--zacht);margin:16px 0 6px}
aside h3:first-child{margin-top:0}
aside input[type=text],aside input[type=number],aside select{width:100%;padding:8px 10px;border:1px solid var(--rand);border-radius:9px;background:#fff}
.rij{display:flex;gap:6px;align-items:center}
.rij>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rand);border-radius:20px;padding:4px 10px;font-size:.85rem;cursor:pointer;background:#fff;user-select:none}
.chip input{margin:0}
.chip.aan{background:var(--groen2);border-color:#b7d5c2}
.schakel{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;border:2px solid var(--rand);cursor:pointer;margin-top:4px;background:#fff}
.schakel.aan{border-color:var(--rood);background:var(--rood2)}
.schakel b{font-size:.95rem}
.schakel small{display:block;color:var(--zacht);font-weight:400}
.wissel{width:42px;height:24px;border-radius:12px;background:#cfc7b6;position:relative;flex:none;transition:.2s}
.wissel::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.schakel.aan .wissel{background:var(--rood)}
.schakel.aan .wissel::after{left:21px}
input[type=range]{width:100%}
.klein{font-size:.8rem;color:var(--zacht)}
.balk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0}
.balk .klein{margin-right:auto}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.kaart{background:var(--paneel);border:1px solid var(--rand);border-radius:var(--radius);overflow:hidden;box-shadow:var(--schaduw);cursor:pointer;display:flex;flex-direction:column;transition:transform .12s}
.kaart:hover{transform:translateY(-2px)}
.foto{aspect-ratio:4/3;background:#e9e2d3 center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center;font-size:3rem}
.foto img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.lint{position:absolute;top:10px;left:10px;background:var(--oranje);color:#fff;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em}
.lint.ok{background:var(--groen)}
.ster{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:34px;height:34px;font-size:1.1rem;cursor:pointer}
.nfoto{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;padding:2px 7px;border-radius:8px}
.inhoud{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.inhoud h4{margin:0;font-size:1.05rem}
.ras{color:var(--zacht);font-size:.9rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.8rem}
.badge{border-radius:7px;padding:2px 8px;background:#efe8da;color:#4d473b}
.badge.asiel,.badge.herplaatsing{background:var(--groen2);color:var(--groen)}
.badge.kennel,.badge.cattery,.badge.kwekerij{background:#e3e9f6;color:var(--blauw)}
.badge.handelaar{background:var(--rood2);color:var(--rood)}
.badge.waarschuwing{background:var(--rood);color:#fff}
.prijs{font-weight:700;font-size:1.05rem;margin-top:auto}
.score{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--zacht)}
.meter{flex:1;height:7px;border-radius:4px;background:#e9e2d3;overflow:hidden}
.meter i{display:block;height:100%}
.leeg{background:var(--paneel);border:1px dashed var(--rand);border-radius:var(--radius);padding:30px;text-align:center;color:var(--zacht)}
.leeg h3{color:var(--tekst)}
.extern{margin-top:22px;background:var(--paneel);border:1px solid var(--rand);border-radius:var(--radius);padding:14px}
.extern h3{margin:0 0 8px;font-size:1rem}
.extern a{display:inline-block;margin:4px 8px 4px 0;color:var(--blauw)}
dialog{border:none;border-radius:18px;padding:0;width:min(920px,95vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(30,25,15,.55)}
.dlg{display:grid;grid-template-columns:1.1fr 1fr}
.galerij{background:#1d1b17;position:relative;min-height:320px}
.galerij img{width:100%;height:100%;object-fit:contain;max-height:80vh;display:block}
.galerij .pijl{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);border:none;border-radius:50%;width:38px;height:38px;font-size:1.2rem;cursor:pointer}
.galerij .l{left:10px}.galerij .r{right:10px}
.duimen{display:flex;gap:4px;padding:6px;background:#1d1b17;overflow-x:auto}
.duimen img{width:56px;height:42px;object-fit:cover;border-radius:4px;opacity:.6;cursor:pointer}
.duimen img.akt{opacity:1;outline:2px solid #fff}
.details{padding:18px 20px;overflow:auto;max-height:92vh}
.details h2{margin:0 0 2px}
.details table{width:100%;border-collapse:collapse;font-size:.9rem;margin:10px 0}
.details td{padding:5px 0;border-bottom:1px solid #f0eadc;vertical-align:top}
.details td:first-child{color:var(--zacht);width:40%}
.redenen{list-style:none;padding:0;margin:6px 0;font-size:.85rem}
.redenen li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted var(--rand)}
.plus{color:var(--groen);font-weight:600}.min{color:var(--rood);font-weight:600}
.signaal{background:var(--rood2);border-left:4px solid var(--rood);padding:8px 10px;border-radius:6px;font-size:.88rem;margin:8px 0}
.sluit{position:absolute;top:10px;right:12px;z-index:3;background:#fff;border:none;border-radius:50%;width:34px;height:34px;font-size:1.2rem;cursor:pointer}
.groot{display:inline-block;background:var(--groen);color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:600;margin-top:8px}
.filterknop{display:none}
@media (max-width:820px){
  main{grid-template-columns:1fr;padding:0 10px 30px}
  aside{position:fixed;inset:0 auto 0 0;width:88vw;max-height:none;height:100vh;z-index:40;border-radius:0;transform:translateX(-100%);transition:.25s}
  aside.open{transform:none;box-shadow:0 0 0 100vw rgba(0,0,0,.4)}
  .filterknop{display:inline-block}
  .dlg{grid-template-columns:1fr}
  header h1{font-size:1.25rem} header .sub{display:none} header .lbl{display:none} header{gap:8px;padding:8px 10px} header img{height:38px}
  .tabs{top:54px;padding:8px 10px 0}
}
</style>
</head>
<body>
<header>
  <img src="assets/wapen.svg" alt="Wapen Endless">
  <div><h1>Zoekdier</h1><div class="sub" id="bijgewerkt">Gegevens laden…</div></div>
  <div class="rechts">
    <button class="knop filterknop" id="openFilter">⚙️<span class="lbl"> Filters</span></button>
    <button class="knop" id="favKnop" title="Alleen bewaarde dieren">☆ Bewaard</button>
    <button class="knop" id="bronKnop">ℹ️<span class="lbl"> Bronnen</span></button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main>
  <aside id="filters">
    <button class="knop filterknop" id="sluitFilter" style="float:right">✕</button>
    <h3>Zoeken</h3>
    <input type="text" id="fZoek" placeholder="Naam, ras of woord…">

    <h3>Ras</h3>
    <select id="fRas"><option value="">Alle rassen</option></select>

    <h3>Afstand</h3>
    <div class="rij">
      <input type="text" id="fLocatie" placeholder="Postcode of plaats">
      <button class="knop" id="mijnLocatie" title="Gebruik mijn locatie" style="flex:none">📍</button>
    </div>
    <div class="klein" id="locInfo">Vul je postcode in om op afstand te filteren.</div>
    <input type="range" id="fAfstand" min="5" max="305" step="5" value="305">
    <div class="klein">Max. afstand: <b id="afstandTxt">onbeperkt</b></div>

    <h3>Beschikbaarheid</h3>
    <div class="chips" id="fStatus">
      <label class="chip"><input type="radio" name="st" value="" checked> Alles</label>
      <label class="chip"><input type="radio" name="st" value="beschikbaar"> Beschikbaar</label>
      <label class="chip"><input type="radio" name="st" value="gereserveerd"> Gereserveerd</label>
    </div>

    <h3>Gegadigden</h3>
    <div class="rij">
      <input type="number" id="fGegadigden" min="0" placeholder="Max. aantal">
    </div>
    <label class="chip" style="margin-top:6px"><input type="checkbox" id="fGegOnbekend" checked> ook als onbekend</label>

    <h3>Prijs (€)</h3>
    <div class="rij">
      <input type="number" id="fPrijsMin" min="0" placeholder="van">
      <input type="number" id="fPrijsMax" min="0" placeholder="tot">
    </div>

    <h3>Aanbieder</h3>
    <div class="chips" id="fType"></div>

    <h3>Betrouwbaarheid</h3>
    <input type="range" id="fScore" min="0" max="100" step="5" value="0">
    <div class="klein">Minimaal: <b id="scoreTxt">0</b> / 100</div>

    <h3>Overig</h3>
    <label class="chip"><input type="checkbox" id="fFoto"> Alleen met foto's</label>

    <div class="schakel" id="broodSchakel" role="switch" aria-checked="false" tabindex="0">
      <div><b>🚫 Broodfokkers uitsluiten</b><small>Verbergt advertenties met handel- of broodfokkersignalen</small></div>
      <span class="wissel"></span>
    </div>

    <button class="knop" id="wis" style="margin-top:14px;width:100%">Filters wissen</button>
  </aside>

  <section>
    <div class="balk">
      <span class="klein" id="telling"></span>
      <select id="sorteer" class="knop">
        <option value="score">Betrouwbaarst eerst</option>
        <option value="afstand">Dichtstbij eerst</option>
        <option value="nieuw">Nieuwste eerst</option>
        <option value="prijs-op">Prijs laag → hoog</option>
        <option value="prijs-af">Prijs hoog → laag</option>
        <option value="gegadigden">Minste gegadigden</option>
      </select>
    </div>
    <div class="raster" id="raster"></div>
    <div class="extern" id="extern"></div>
  </section>
</main>

<dialog id="dlg"></dialog>
<dialog id="bronDlg"></dialog>

<script>
"use strict";
const SOORTEN = [
  {k:"hond", t:"Honden", e:"🐕"}, {k:"kat", t:"Katten", e:"🐈"},
  {k:"vogel", t:"Vogels", e:"🦜"}, {k:"overig", t:"Overig", e:"🐇"}
];
const TYPES = {
  asiel:"Asiel / opvang", herplaatsing:"Herplaatsing", kennel:"Kennel", cattery:"Cattery (katterie)",
  kwekerij:"Kwekerij", particulier:"Particulier", handelaar:"Handelaar", onbekend:"Onbekend"
};
const EXTERN = {
  hond:[["Verhuisdieren – honden","https://verhuisdieren.nl/honden/adoptiehonden/"],["Ik zoek baas (asielen)","https://www.ikzoekbaas.nl/"],["Raad van Beheer – pups met stamboom","https://www.houdenvanhonden.nl/"],["Marktplaats","https://www.marktplaats.nl/q/{q}/"]],
  kat:[["Verhuisdieren – katten","https://verhuisdieren.nl/katten/adoptiekatten/"],["Ik zoek baas (asielen)","https://www.ikzoekbaas.nl/"],["Marktplaats","https://www.marktplaats.nl/q/{q}/"]],
  vogel:[["Ik zoek baas (asielen)","https://www.ikzoekbaas.nl/"],["Marktplaats – vogels","https://www.marktplaats.nl/q/{q}/"]],
  overig:[["Verhuisdieren – alle dieren","https://verhuisdieren.nl/alle-dieren/?type=adopt"],["Ik zoek baas (asielen)","https://www.ikzoekbaas.nl/"],["Marktplaats","https://www.marktplaats.nl/q/{q}/"]]
};
const ZOEKWOORD = {hond:"pup", kat:"kitten", vogel:"vogel", overig:"konijn"};

// ---------- opslag (best effort) ----------
const opslag = {
  get(k, d){ try { const v = localStorage.getItem("zoekdier:"+k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem("zoekdier:"+k, JSON.stringify(v)); } catch {} }
};

let DIEREN = [], BRONSTATUS = null;
let favorieten = new Set(opslag.get("fav", []));
const S = Object.assign({
  tab:"hond", zoek:"", ras:"", locatie:"", coord:null, afstand:305, status:"", gegMax:"", gegOnbekend:true,
  prijsMin:"", prijsMax:"", types:[], minScore:0, foto:false, geenBrood:false, sorteer:"score", alleenFav:false
}, opslag.get("filters", {}));

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const veiligeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";
const kleur = s => s >= 75 ? "var(--groen)" : s >= 50 ? "var(--geel)" : s >= 30 ? "var(--oranje)" : "var(--rood)";
const euro = p => p == null ? null : p === 0 ? "Gratis" : "€ " + p.toLocaleString("nl-NL", {maximumFractionDigits:0});

function km(a, b){
  if(!a || !b) return null;
  const R=6371, r=x=>x*Math.PI/180, dLat=r(b[0]-a[0]), dLon=r(b[1]-a[1]);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function datum(d){ // "23-11-2026" of ISO
  if(!d) return 0;
  const m = /^(\d{2})-(\d{2})-(\d{4})/.exec(d);
  return m ? new Date(+m[3], m[2]-1, +m[1]).getTime() : (Date.parse(d) || 0);
}

// ---------- laden ----------
async function laad(){
  try {
    const [r1, r2] = await Promise.all([fetch("data/dieren.json", {cache:"no-cache"}), fetch("data/bronstatus.json", {cache:"no-cache"})]);
    const data = await r1.json();
    DIEREN = (data.dieren || []).map(d => ({...d, fotos: (d.fotos || []).filter(Boolean)}));
    BRONSTATUS = await r2.json().catch(() => null);
    $("#bijgewerkt").textContent = data.gegenereerd
      ? "Bijgewerkt " + new Date(data.gegenereerd).toLocaleString("nl-NL", {dateStyle:"medium", timeStyle:"short"}) + " · " + DIEREN.length + " dieren"
      : "Nog geen gegevens opgehaald";
  } catch(e) {
    $("#bijgewerkt").textContent = "Kon gegevens niet laden";
  }
  if(S.locatie && !S.coord) zoekLocatie(S.locatie);
  bouwUI(); toon();
}

// ---------- UI opbouwen ----------
function bouwTabs(){
  const tel = {}; DIEREN.forEach(d => tel[d.soort] = (tel[d.soort]||0)+1);
  $("#tabs").innerHTML = SOORTEN.map(s => `<button class="tab ${S.tab===s.k?"actief":""}" data-tab="${s.k}">${s.e} ${s.t}<span class="tel">${tel[s.k]||0}</span></button>`).join("");
}
function bouwRassen(){
  const rassen = [...new Set(DIEREN.filter(d => d.soort===S.tab && d.ras).map(d => d.ras.trim()))]
    .sort((a,b) => a.localeCompare(b, "nl"));
  if(S.ras && !rassen.includes(S.ras)) S.ras = "";
  $("#fRas").innerHTML = `<option value="">Alle rassen (${rassen.length})</option>` + rassen.map(r => `<option ${r===S.ras?"selected":""}>${esc(r)}</option>`).join("");
}
function bouwTypes(){
  $("#fType").innerHTML = Object.entries(TYPES).filter(([k]) => k!=="onbekend").map(([k,t]) =>
    `<label class="chip ${S.types.includes(k)?"aan":""}"><input type="checkbox" value="${k}" ${S.types.includes(k)?"checked":""}> ${t}</label>`).join("");
}
function bouwUI(){
  bouwTabs(); bouwRassen(); bouwTypes();
  $("#fZoek").value = S.zoek; $("#fLocatie").value = S.locatie; $("#fAfstand").value = S.afstand;
  $("#fGegadigden").value = S.gegMax; $("#fGegOnbekend").checked = S.gegOnbekend;
  $("#fPrijsMin").value = S.prijsMin; $("#fPrijsMax").value = S.prijsMax;
  $("#fScore").value = S.minScore; $("#fFoto").checked = S.foto; $("#sorteer").value = S.sorteer;
  document.querySelectorAll('#fStatus input').forEach(i => { i.checked = i.value === S.status; i.parentElement.classList.toggle("aan", i.checked); });
  zetBrood(); tekstjes();
  favLabel();
}
function favLabel(){ $("#favKnop").innerHTML = (S.alleenFav ? "★" : "☆") + '<span class="lbl"> Bewaard</span>'; }
function tekstjes(){
  $("#afstandTxt").textContent = S.afstand >= 305 ? "onbeperkt" : S.afstand + " km";
  $("#scoreTxt").textContent = S.minScore;
}
function zetBrood(){
  const el = $("#broodSchakel"); el.classList.toggle("aan", S.geenBrood); el.setAttribute("aria-checked", S.geenBrood);
}

// ---------- filteren ----------
function gefilterd(){
  const q = S.zoek.trim().toLowerCase();
  const gegMax = S.gegMax === "" ? null : +S.gegMax;
  const pMin = S.prijsMin === "" ? null : +S.prijsMin, pMax = S.prijsMax === "" ? null : +S.prijsMax;
  let lijst = DIEREN.filter(d => {
    if(d.soort !== S.tab) return false;
    if(S.alleenFav && !favorieten.has(d.id)) return false;
    if(q && !`${d.naam} ${d.ras} ${d.beschrijving} ${d.plaats} ${d.aanbieder?.naam}`.toLowerCase().includes(q)) return false;
    if(S.ras && (d.ras||"").trim() !== S.ras) return false;
    if(S.status && d.status !== S.status) return false;
    if(gegMax !== null){ if(d.gegadigden == null){ if(!S.gegOnbekend) return false; } else if(d.gegadigden > gegMax) return false; }
    if(pMin !== null && (d.prijs == null || d.prijs < pMin)) return false;
    if(pMax !== null && (d.prijs == null || d.prijs > pMax)) return false;
    if(S.types.length && !S.types.includes(d.aanbieder?.type || "onbekend")) return false;
    if((d.betrouwbaarheid?.score ?? 0) < S.minScore) return false;
    if(S.foto && !d.fotos.length) return false;
    if(S.geenBrood && d.broodfokker_verdacht) return false;
    d._km = km(S.coord, d.coord);
    if(S.coord && S.afstand < 305 && (d._km == null || d._km > S.afstand)) return false;
    return true;
  });
  const s = S.sorteer, oneindig = 1e9;
  lijst.sort((a,b) =>
    s==="afstand" ? (a._km ?? oneindig) - (b._km ?? oneindig) :
    s==="nieuw" ? datum(b.geplaatst||b.bijgewerkt) - datum(a.geplaatst||a.bijgewerkt) :
    s==="prijs-op" ? (a.prijs ?? oneindig) - (b.prijs ?? oneindig) :
    s==="prijs-af" ? (b.prijs ?? -1) - (a.prijs ?? -1) :
    s==="gegadigden" ? (a.gegadigden ?? oneindig) - (b.gegadigden ?? oneindig) :
    (b.betrouwbaarheid?.score ?? 0) - (a.betrouwbaarheid?.score ?? 0));
  return lijst;
}

// ---------- tonen ----------
const MAX_TONEN = 120; let getoond = MAX_TONEN;
function kaart(d){
  const sc = d.betrouwbaarheid?.score ?? 0, type = d.aanbieder?.type || "onbekend";
  const em = SOORTEN.find(s => s.k===d.soort)?.e || "🐾";
  const foto = d.fotos[0];
  const prijs = euro(d.prijs) || (d.prijs_tekst ? esc(d.prijs_tekst) : "Prijs onbekend");
  return `<article class="kaart" data-id="${esc(d.id)}">
    <div class="foto">${em}${foto ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(veiligeUrl(foto))}" alt="${esc(d.naam)}" onerror="this.remove()">` : ""}
      <span class="lint ${d.status==="gereserveerd"?"":"ok"}">${d.status==="gereserveerd"?"Gereserveerd":"Beschikbaar"}</span>
      <button class="ster" data-fav="${esc(d.id)}" title="Bewaren">${favorieten.has(d.id)?"★":"☆"}</button>
      ${d.fotos.length>1 ? `<span class="nfoto">📷 ${d.fotos.length}</span>` : ""}
    </div>
    <div class="inhoud">
      <h4>${esc(d.naam)}</h4>
      <div class="ras">${esc(d.ras || "Ras onbekend")}${d.leeftijd ? " · " + esc(d.leeftijd) : ""}</div>
      <div class="meta">
        <span class="badge ${type}">${TYPES[type] || type}</span>
        ${d.plaats ? `<span class="badge">📍 ${esc(d.plaats)}${d._km!=null ? " · " + Math.round(d._km) + " km" : ""}</span>` : ""}
        <span class="badge">👥 ${d.gegadigden!=null ? d.gegadigden + " gegadigden" : "gegadigden onbekend"}</span>
        ${d.broodfokker_verdacht ? `<span class="badge waarschuwing">⚠ broodfokker?</span>` : ""}
      </div>
      <div class="prijs">${prijs}</div>
      <div class="score" title="Betrouwbaarheidsindicatie"><span>Betrouwbaarheid</span><span class="meter"><i style="width:${sc}%;background:${kleur(sc)}"></i></span><b>${sc}</b></div>
    </div>
  </article>`;
}
function toon(){
  opslag.set("filters", {...S, coord:S.coord});
  const lijst = gefilterd();
  const soort = SOORTEN.find(s => s.k===S.tab);
  $("#telling").textContent = `${lijst.length} ${soort.t.toLowerCase()} gevonden` + (S.geenBrood ? " · broodfokkers uitgesloten" : "");
  if(!DIEREN.length){
    $("#raster").innerHTML = `<div class="leeg"><h3>Nog geen dieren opgehaald</h3>
      <p>De gegevens worden door de GitHub Action <b>“Dieren ophalen”</b> verzameld (elke 6 uur).
      Start hem één keer handmatig via <b>Actions → Dieren ophalen → Run workflow</b> in de repo.</p></div>`;
  } else if(!lijst.length){
    $("#raster").innerHTML = `<div class="leeg"><h3>Geen ${soort.t.toLowerCase()} gevonden</h3><p>Probeer minder filters of een grotere afstand.</p></div>`;
  } else {
    $("#raster").innerHTML = lijst.slice(0, getoond).map(kaart).join("") +
      (lijst.length > getoond ? `<div class="leeg" style="grid-column:1/-1"><button class="knop" id="meer">Toon meer (${lijst.length - getoond} over)</button></div>` : "");
  }
  const q = encodeURIComponent(((S.ras || "") + " " + ZOEKWOORD[S.tab]).trim());
  $("#extern").innerHTML = `<h3>Ook zelf zoeken bij</h3>` + EXTERN[S.tab].map(([t,u]) => `<a href="${esc(u.replace("{q}", q))}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join("") +
    `<div class="klein">Marktplaats wordt niet automatisch uitgelezen (niet toegestaan volgens hun voorwaarden); deze link opent je zoekopdracht daar.</div>`;
}

// ---------- detailvenster ----------
function openDetail(id){
  const d = DIEREN.find(x => x.id === id); if(!d) return;
  const b = d.betrouwbaarheid || {score:0, redenen:[]}, type = d.aanbieder?.type || "onbekend";
  let i = 0;
  const rij = (k, v) => v ? `<tr><td>${k}</td><td>${v}</td></tr>` : "";
  const dlg = $("#dlg");
  dlg.innerHTML = `<button class="sluit" onclick="this.closest('dialog').close()">✕</button>
  <div class="dlg">
    <div>
      <div class="galerij">${d.fotos.length ? `<img id="grootFoto" referrerpolicy="no-referrer" onerror="this.alt='Foto niet te laden';this.style.minHeight='320px'" src="${esc(veiligeUrl(d.fotos[0]))}" alt="${esc(d.naam)}">
        ${d.fotos.length>1 ? `<button class="pijl l" data-stap="-1">‹</button><button class="pijl r" data-stap="1">›</button>` : ""}`
        : `<div style="color:#fff;padding:120px 20px;text-align:center">Geen foto's beschikbaar</div>`}</div>
      ${d.fotos.length>1 ? `<div class="duimen">${d.fotos.map((f,n) => `<img data-n="${n}" referrerpolicy="no-referrer" class="${n?"":"akt"}" src="${esc(veiligeUrl(f))}" alt="">`).join("")}</div>` : ""}
    </div>
    <div class="details">
      <h2>${esc(d.naam)}</h2>
      <div class="ras">${esc(d.ras || "Ras onbekend")}</div>
      <table>
        ${rij("Status", d.status === "gereserveerd" ? "<b style='color:var(--oranje)'>Gereserveerd</b>" : "<b style='color:var(--groen)'>Beschikbaar</b>")}
        ${rij("Prijs", euro(d.prijs) ? euro(d.prijs) + (d.prijs_tekst && !/^€/.test(d.prijs_tekst) ? " <span class='klein'>(" + esc(d.prijs_tekst) + ")</span>" : "") : esc(d.prijs_tekst) || "Onbekend")}
        ${rij("Gegadigden", d.gegadigden != null ? d.gegadigden : "Onbekend (niet vermeld door bron)")}
        ${rij("Aanbieder", esc(d.aanbieder?.naam) + ` <span class="badge ${type}">${TYPES[type]||type}</span>`)}
        ${rij("Leeftijd", esc(d.leeftijd))}${rij("Geslacht", esc(d.geslacht))}${rij("Herkomst", esc(d.herkomst))}
        ${rij("Plaats", esc(d.plaats) + (d._km != null ? ` (${Math.round(d._km)} km)` : ""))}
        ${rij("Geplaatst", esc(d.geplaatst))}${rij("Bron", esc(d.bron))}
      </table>
      ${d.beschrijving ? `<p style="font-size:.92rem;line-height:1.45">${esc(d.beschrijving)}</p>` : ""}
      <h3 style="margin-bottom:4px">Betrouwbaarheid: <span style="color:${kleur(b.score)}">${b.score}/100</span></h3>
      <ul class="redenen">${b.redenen.map(r => `<li><span>${esc(r.tekst)}</span><span class="${r.punten<0?"min":"plus"}">${r.punten>0?"+":""}${r.punten}</span></li>`).join("")}</ul>
      ${d.broodfokker_signalen?.length ? `<div class="signaal"><b>⚠ Let op:</b><br>${d.broodfokker_signalen.map(esc).join("<br>")}</div>` : ""}
      <div class="klein">Indicatie op basis van de advertentietekst. Controleer zelf: bezoek, ouderdieren, chip/paspoort${d.soort==="hond"?", UBN van de fokker":""}${d.soort==="kat"||d.soort==="hond"?", stamboompapieren":""}.</div>
      <a class="groot" href="${esc(veiligeUrl(d.url))}" target="_blank" rel="noopener">Bekijk bij ${esc(d.bron || "bron")} ↗</a>
      <button class="knop" style="margin-left:6px" data-fav="${esc(d.id)}">${favorieten.has(d.id) ? "★ Bewaard" : "☆ Bewaren"}</button>
    </div>
  </div>`;
  const zet = n => { i = (n + d.fotos.length) % d.fotos.length; $("#grootFoto").src = veiligeUrl(d.fotos[i]);
    dlg.querySelectorAll(".duimen img").forEach((im,k) => im.classList.toggle("akt", k===i)); };
  dlg.onclick = e => {
    const t = e.target;
    if(t.dataset.stap) zet(i + +t.dataset.stap);
    else if(t.dataset.n) zet(+t.dataset.n);
    else if(t.dataset.fav){ wisselFav(t.dataset.fav); t.textContent = favorieten.has(d.id) ? "★ Bewaard" : "☆ Bewaren"; }
    else if(t === dlg) dlg.close();
  };
  dlg.showModal();
}

function toonBronnen(){
  const dlg = $("#bronDlg");
  const rijen = (BRONSTATUS?.bronnen || []).map(b => `<tr><td>${b.ok ? "✅" : "⚠️"} ${esc(b.bron)}</td><td>${b.aantal} dieren${b.fout ? " · " + esc(b.fout) : ""}</td></tr>`).join("")
    || `<tr><td colspan="2">Nog geen run gedaan.</td></tr>`;
  dlg.innerHTML = `<button class="sluit" onclick="this.closest('dialog').close()">✕</button>
    <div class="details" style="max-height:none"><h2>Bronnen</h2>
    <p class="klein">Laatste ophaalrun: ${BRONSTATUS?.gegenereerd ? new Date(BRONSTATUS.gegenereerd).toLocaleString("nl-NL") : "–"}</p>
    <table>${rijen}</table>
    <p class="klein">Bronnen toevoegen of aanpassen: <code>scraper/bronnen.json</code>. Verhuisdieren.nl heeft een eigen uitlezer.
    Asielen, kennels en catteries met een eigen site kun je daar zonder programmeren toevoegen.</p>
    <h3>Hoe de betrouwbaarheid werkt</h3>
    <p class="klein">Startscore per aanbieder (asiel 75, herplaatsing 65, kennel/cattery 55, particulier 45, handelaar 30).
    Pluspunten voor stamboom (Raad van Beheer, FIFe/Felikat), UBN, chip/paspoort, gezondheidsonderzoeken van de ouderdieren, ouderdieren te zien, vaccinaties.
    Minpunten voor broodfokkersignalen: “direct meenemen”, bezorgen of overdracht op een parkeerplaats, meerdere rassen of nesten tegelijk, importpups,
    te jong (hond &lt; 7 wk, kat &lt; 12 wk), vouwoorkatten (verboden sinds 2026), een prijs ver onder het gemiddelde, geen papieren, en dezelfde aanbieder met 3 of meer rassen.
    Bij 25 of meer signaalpunten, of bij een handelaar, telt de advertentie als <b>broodfokker?</b>.</p></div>`;
  dlg.onclick = e => { if(e.target === dlg) dlg.close(); };
  dlg.showModal();
}

function wisselFav(id){
  favorieten.has(id) ? favorieten.delete(id) : favorieten.add(id);
  opslag.set("fav", [...favorieten]);
  document.querySelectorAll(`.ster[data-fav="${CSS.escape(id)}"]`).forEach(b => b.textContent = favorieten.has(id) ? "★" : "☆");
}

// ---------- locatie ----------
let locTimer;
async function zoekLocatie(q){
  q = q.trim();
  if(!q){ S.coord = null; $("#locInfo").textContent = "Vul je postcode in om op afstand te filteren."; toon(); return; }
  $("#locInfo").textContent = "Zoeken…";
  try {
    const url = "https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?rows=1&fl=centroide_ll,weergavenaam&fq=type:(postcode OR woonplaats OR adres)&q=" + encodeURIComponent(q);
    const doc = (await (await fetch(url)).json()).response.docs[0];
    const m = doc && /POINT\(([\d.]+) ([\d.]+)\)/.exec(doc.centroide_ll);
    if(!m) throw 0;
    S.coord = [+m[2], +m[1]];
    $("#locInfo").textContent = "📍 " + doc.weergavenaam;
  } catch { S.coord = null; $("#locInfo").textContent = "Locatie niet gevonden."; }
  toon();
}

// ---------- events ----------
$("#tabs").onclick = e => { const t = e.target.closest(".tab"); if(!t) return; S.tab = t.dataset.tab; getoond = MAX_TONEN; bouwTabs(); bouwRassen(); toon(); };
$("#fZoek").oninput = e => { S.zoek = e.target.value; toon(); };
$("#fRas").onchange = e => { S.ras = e.target.value; toon(); };
$("#fLocatie").oninput = e => { S.locatie = e.target.value; clearTimeout(locTimer); locTimer = setTimeout(() => zoekLocatie(S.locatie), 600); };
$("#mijnLocatie").onclick = () => {
  if(!navigator.geolocation){ $("#locInfo").textContent = "Locatie niet beschikbaar in deze browser."; return; }
  $("#locInfo").textContent = "Locatie bepalen…";
  navigator.geolocation.getCurrentPosition(p => { S.coord = [p.coords.latitude, p.coords.longitude]; S.locatie = ""; $("#fLocatie").value = "";
    $("#locInfo").textContent = "📍 Mijn huidige locatie"; toon(); }, () => $("#locInfo").textContent = "Geen toestemming voor locatie.");
};
$("#fAfstand").oninput = e => { S.afstand = +e.target.value; tekstjes(); toon(); };
$("#fStatus").onchange = e => { S.status = e.target.value; document.querySelectorAll('#fStatus label').forEach(l => l.classList.toggle("aan", l.firstElementChild.checked)); toon(); };
$("#fGegadigden").oninput = e => { S.gegMax = e.target.value; toon(); };
$("#fGegOnbekend").onchange = e => { S.gegOnbekend = e.target.checked; toon(); };
$("#fPrijsMin").oninput = e => { S.prijsMin = e.target.value; toon(); };
$("#fPrijsMax").oninput = e => { S.prijsMax = e.target.value; toon(); };
$("#fType").onchange = e => { S.types = [...document.querySelectorAll("#fType input:checked")].map(i => i.value); bouwTypes(); toon(); };
$("#fScore").oninput = e => { S.minScore = +e.target.value; tekstjes(); toon(); };
$("#fFoto").onchange = e => { S.foto = e.target.checked; toon(); };
const brood = () => { S.geenBrood = !S.geenBrood; zetBrood(); toon(); };
$("#broodSchakel").onclick = brood;
$("#broodSchakel").onkeydown = e => { if(e.key === " " || e.key === "Enter"){ e.preventDefault(); brood(); } };
$("#sorteer").onchange = e => { S.sorteer = e.target.value; toon(); };
$("#wis").onclick = () => { Object.assign(S, {zoek:"", ras:"", locatie:"", coord:null, afstand:305, status:"", gegMax:"", gegOnbekend:true, prijsMin:"", prijsMax:"", types:[], minScore:0, foto:false, geenBrood:false, alleenFav:false}); bouwUI(); toon(); };
$("#favKnop").onclick = () => { S.alleenFav = !S.alleenFav; favLabel(); toon(); };
$("#bronKnop").onclick = toonBronnen;
$("#openFilter").onclick = () => $("#filters").classList.add("open");
$("#sluitFilter").onclick = () => $("#filters").classList.remove("open");
$("#raster").onclick = e => {
  if(e.target.id === "meer"){ getoond += MAX_TONEN; toon(); return; }
  const f = e.target.closest("[data-fav]"); if(f){ e.stopPropagation(); wisselFav(f.dataset.fav); if(S.alleenFav) toon(); return; }
  const k = e.target.closest(".kaart"); if(k) openDetail(k.dataset.id);
};
laad();
</script>
</body>
</html>
